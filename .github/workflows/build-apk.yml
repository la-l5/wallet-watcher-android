name: Android CI & Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Accept Android SDK Licenses (if needed)
        run: |
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Run Pure JVM & Robolectric SQLite Unit Tests
        run: |
          gradle testDebugUnitTest --stacktrace
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"))
          assert files, "No test XML files generated"
          total = 0
          for f in files:
              root = ET.parse(f).getroot()
              tests = int(root.get("tests", 0))
              failures = int(root.get("failures", 0))
              errors = int(root.get("errors", 0))
              skipped = int(root.get("skipped", 0))
              assert failures == 0 and errors == 0, f"Test failure in {f}"
              passed = tests - skipped
              total += passed
              print(f"{root.get('name')}: {passed} passed")
          assert total > 0
          print(f"Verified total unit tests passed: {total}")
          PY

      - name: Build Debug APK (Coexists with Release via .debug suffix, Zero Baked Keys)
        run: |
          gradle assembleDebug --no-build-cache --no-configuration-cache
          python3 - <<'PY'
          import hashlib, re, zipfile
          apk_path = "app/build/outputs/apk/debug/app-debug.apk"
          with open(apk_path, "rb") as f:
              print("Debug APK File SHA-256:", hashlib.sha256(f.read()).hexdigest())
          key_pattern = re.compile(rb"(?<![A-Za-z0-9_-])sk-[A-Za-z0-9]{20,}")
          with zipfile.ZipFile(apk_path) as apk:
              dex_blobs = [apk.read(n) for n in apk.namelist() if n.endswith(".dex")]
              assert not any(key_pattern.search(blob) for blob in dex_blobs), "Unexpected API key pattern found in DEX"
          PY

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wallet-watcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
