name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Accept Android SDK Licenses (if needed)
        run: |
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Run Offline Unit Tests
        run: |
          gradle testDebugUnitTest --stacktrace
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          suites = [ET.parse(f).getroot() for f in glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")]
          passed = sum(int(s.get("tests")) - int(s.get("skipped", 0)) for s in suites)
          assert passed > 0
          print(f"Verified JVM tests passed: {passed}")
          PY

      - name: Build Debug APK (with Secret API Key Injection)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
        run: |
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "::warning::Repository Secret DEEPSEEK_API_KEY is not set. APK will build without a baked-in key (you can still fill it inside the app Settings)."
          fi
          gradle assembleDebug --no-build-cache --no-configuration-cache --rerun-tasks
          python3 - <<'PY'
          import os, zipfile
          key = os.environ["DEEPSEEK_API_KEY"].encode()
          if key:
              with zipfile.ZipFile("app/build/outputs/apk/debug/app-debug.apk") as apk:
                  if not any(key in apk.read(n) for n in apk.namelist() if n.endswith(".dex")):
                      raise SystemExit("Configured key missing from packaged DEX")
          PY

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wallet-watcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
