name: Build Signed Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Accept Android SDK Licenses (if needed)
        run: |
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Run Unit & SQLite Tests Before Release
        run: gradle testDebugUnitTest --stacktrace

      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${RELEASE_KEYSTORE_BASE64}" ]; then
            echo "::error::Missing RELEASE_KEYSTORE_BASE64 secret in release environment"
            exit 1
          fi
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"

      - name: Build Signed Release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-build-cache --no-configuration-cache
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "${APK}"
          mkdir -p release-dist
          cp "${APK}" release-dist/wallet-watcher-release.apk
          {
            echo "# Wallet Watcher Release Checksums"
            echo ""
            echo "## APK File SHA-256 (verify download integrity)"
            sha256sum release-dist/wallet-watcher-release.apk
            echo ""
            echo "## APK Signing Certificate SHA-256 Fingerprint (verify publisher identity)"
            APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)"
            if [ -n "${APKSIGNER}" ]; then
              "${APKSIGNER}" verify --print-certs release-dist/wallet-watcher-release.apk
            else
              keytool -printcert -jarfile release-dist/wallet-watcher-release.apk
            fi
          } | tee release-dist/checksums.txt

      - name: Clean Up Keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"

      - name: Upload Signed Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: wallet-watcher-release-apk
          path: |
            release-dist/wallet-watcher-release.apk
            release-dist/checksums.txt
          if-no-files-found: error
